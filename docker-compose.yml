services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - linguasure-data:/app/data
    restart: unless-stopped

volumes:
  linguasure-data:
